<div class="confirm-backdrop" *ngIf="request() as req" (click)="responder(false)">
  <div class="confirm-card shadow" (click)="$event.stopPropagation()">
    <p class="mb-4">{{ req.mensagem }}</p>
    <div class="d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-secondary" (click)="responder(false)">{{ req.textoCancelar }}</button>
      <button type="button" class="btn btn-danger" (click)="responder(true)">{{ req.textoConfirmar }}</button>
    </div>
  </div>
</div>
